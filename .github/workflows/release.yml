name: Build and Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🏗️ Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📝 Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 Version: v$VERSION"

      - name: 🚀 Build APK with EAS (and wait)
        id: build
        run: |
          echo "Starting EAS Build (this will take 10-20 minutes)..."
          
          # Start build and capture output
          eas build --platform android --profile preview --non-interactive --wait > build_output.txt 2>&1 || true
          
          # Display output
          cat build_output.txt
          
          # Extract build URL from output
          BUILD_URL=$(cat build_output.txt | grep -o 'https://expo.dev/accounts/[^/]*/projects/[^/]*/builds/[a-f0-9-]*' | head -1)
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          echo "📊 Build URL: $BUILD_URL"
          
          # Get build ID
          BUILD_ID=$(echo "$BUILD_URL" | grep -o '[a-f0-9-]*$')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "🆔 Build ID: $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Get APK download URL
        id: apk
        run: |
          # List recent builds and get the artifact URL
          echo "Fetching build artifact URL..."
          
          # Get build details
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          
          # Try to get artifact URL from EAS CLI
          eas build:view $BUILD_ID > build_details.txt 2>&1 || true
          cat build_details.txt
          
          # Extract download URL from output
          APK_URL=$(cat build_details.txt | grep -i "download" | grep -o 'https://[^[:space:]]*' | head -1)
          
          # If not found, try alternative pattern
          if [ -z "$APK_URL" ]; then
            APK_URL=$(cat build_details.txt | grep -o 'https://[^[:space:]]*\.apk[^[:space:]]*' | head -1)
          fi
          
          # If still not found, construct URL pattern (Expo's typical format)
          if [ -z "$APK_URL" ]; then
            echo "⚠️ Could not extract URL from CLI output, checking Expo API..."
            # Fallback: The artifact is usually available at the build details page
            echo "Build details available at: ${{ steps.build.outputs.build_url }}"
            # We'll need to use expo's API or manual intervention
            exit 1
          fi
          
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "📦 APK URL: $APK_URL"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 💾 Download APK
        run: |
          echo "Downloading APK..."
          APK_URL="${{ steps.apk.outputs.apk_url }}"
          
          # Download with curl
          curl -L -o TicketGOAT.apk "$APK_URL"
          
          # Verify download
          if [ -f TicketGOAT.apk ]; then
            SIZE=$(ls -lh TicketGOAT.apk | awk '{print $5}')
            echo "✅ APK downloaded successfully: $SIZE"
            ls -lh TicketGOAT.apk
          else
            echo "❌ Failed to download APK"
            exit 1
          fi

      - name: 🏷️ Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TicketGOAT v${{ steps.version.outputs.version }}
          body: |
            ## 🎉 TicketGOAT v${{ steps.version.outputs.version }}
            
            ### 📱 Installation
            
            1. Download `TicketGOAT-v${{ steps.version.outputs.version }}.apk` below
            2. Enable "Install from Unknown Sources" in your Android device settings
            3. Open the APK file and install
            4. Enjoy tracking your finances!
            
            ### 📋 What's New
            
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for detailed changes.
            
            ### 🔧 Features
            
            - 💰 Transaction tracking with categories
            - 🏦 Multiple account management
            - 📈 Stock portfolio with real-time prices
            - 🎫 OCR receipt scanning (optional)
            - 📊 Excel/CSV import & export
            
            ---
            
            **Build ID:** `${{ steps.build.outputs.build_id }}`  
            **Build URL:** ${{ steps.build.outputs.build_url }}  
            **Commit:** `${{ github.sha }}`  
            **Built:** ${{ github.event.head_commit.timestamp }}
          files: TicketGOAT.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Success Summary
        run: |
          echo "### 🎉 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ steps.create_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📦 APK is now available for download:**" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Users can now download and install the app!"
