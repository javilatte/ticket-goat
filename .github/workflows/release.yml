name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    name: Start Build and Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🏗️ Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📝 Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 Version: v$VERSION"

      - name: 🚀 Start EAS Build (no-wait)
        id: build
        run: |
          echo "Starting EAS Build..."
          
          # Start build without waiting
          eas build --platform android --profile preview --non-interactive --no-wait > build_output.txt 2>&1
          
          # Display output
          cat build_output.txt
          
          # Extract build URL from output
          BUILD_URL=$(cat build_output.txt | grep -o 'https://expo.dev/accounts/[^/]*/projects/[^/]*/builds/[a-f0-9-]*' | head -1)
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          echo "📊 Build URL: $BUILD_URL"
          
          # Get build ID
          BUILD_ID=$(echo "$BUILD_URL" | grep -o '[a-f0-9-]*$')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "🆔 Build ID: $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🏷️ Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TicketGOAT v${{ steps.version.outputs.version }}
          body: |
            ## 🎉 TicketGOAT v${{ steps.version.outputs.version }}
            
            ### 📱 Installation
            
            1. Download the APK file below (will be uploaded manually after build completes)
            2. Enable "Install from Unknown Sources" in your Android device settings
            3. Open the APK file and install
            4. Enjoy tracking your finances!
            
            ### 📋 What's New
            
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.
            
            ### 🔧 Features
            
            - 💰 Transaction tracking with categories
            - 🏦 Multiple account management
            - 📈 Stock portfolio with real-time prices
            - 🔒 Military-grade AES-256 encryption
            - 🎫 OCR receipt scanning (optional)
            - 📊 Excel/CSV import & export
            
            ---
            
            **Build Status:** Building...  
            **Build ID:** `${{ steps.build.outputs.build_id }}`  
            **Build URL:** ${{ steps.build.outputs.build_url }}  
            **Commit:** `${{ github.sha }}`  
            **Built:** ${{ github.event.head_commit.timestamp }}
            
            > ⏳ The APK is being built by Expo. Download it from the build URL above when ready and upload it to this release.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Success Summary
        run: |
          echo "### 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ steps.create_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📦 Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Wait for Expo build to complete: ${{ steps.build.outputs.build_url }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Download the APK from Expo" >> $GITHUB_STEP_SUMMARY
          echo "3. Upload it manually to the GitHub release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ Build typically takes 10-20 minutes"
